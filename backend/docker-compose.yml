# backend/docker-compose.yml
services:
  # ==================== FASTAPI BACKEND ====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bridge-backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-6443}
      API_TITLE: ${API_TITLE:-BRIDGE LLM Form API}
      API_VERSION: ${API_VERSION:-1.0.0}

      #ROOT_PATH: ${ROOT_PATH:-/dataclerk-ai}

      # ==================== SSL Configuration ====================
      USE_HTTPS: ${USE_HTTPS:-true}
      SSL_CERT_FILE: ${SSL_CERT_FILE:-/app/certs/public.crt}
      SSL_KEY_FILE: ${SSL_KEY_FILE:-/app/certs/private.key}
      SSL_VERIFY: ${SSL_VERIFY:-false}

      # MongoDB (Remote)
      MONGODB_HOST: ${MONGODB_HOST:-host.docker.internal}
      MONGODB_PORT: ${MONGODB_PORT:-27017}
      MONGODB_USERNAME: ${MONGODB_USERNAME:-root}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-password}
      MONGODB_AUTH_SOURCE: ${MONGODB_AUTH_SOURCE:-admin}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-bridge_webui_mvp}
      MONGODB_DB_COLLECTION: ${MONGODB_DB_COLLECTION:-webui_form_processor_stats}
      MONGODB_POOL_SIZE: ${MONGODB_POOL_SIZE:-10}
      MONGODB_MAX_IDLE_TIME: ${MONGODB_MAX_IDLE_TIME:-45000}
      MONGODB_REPLICA_SET: ${MONGODB_REPLICA_SET:-bridge_repl}
      MONGODB_PATIENT_SUMMARY_COLLECTION: ${MONGODB_PATIENT_SUMMARY_COLLECTION:-patient_summary}
      MONGODB_CHANGE_STREAM_STATE_COLLECTION: ${MONGODB_CHANGE_STREAM_STATE_COLLECTION:-change_stream_state}
      ENABLE_CHANGE_STREAM_WATCHER: ${ENABLE_CHANGE_STREAM_WATCHER:-true}


      # MinIO (Remote)
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-host.docker.internal:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-bridge-ui-forms}
      MINIO_SECURE: ${MINIO_SECURE:-true}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}

      # Qwen LLM
      QWEN_SERVICE_URL: ${QWEN_SERVICE_URL:-https://qwen:8443}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-turbo}
      QWEN_TIMEOUT: ${QWEN_TIMEOUT:-300}
      QWEN_MAX_RETRIES: ${QWEN_MAX_RETRIES:-3}

      # File Upload
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-15}
      UPLOAD_TEMP_DIR: ${UPLOAD_TEMP_DIR:-/app/tmp/uploads}
      ALLOWED_EXTENSIONS: ${ALLOWED_EXTENSIONS:-["png"]}

      # Prompt Configuration
      PROMPTS_DIR: ${PROMPTS_DIR:-/app/prompts}
      DEFAULT_PROMPT_FILE: ${DEFAULT_PROMPT_FILE:-DEFAULT.txt}
      DEFAULT_PROMPT_FALLBACK: ${DEFAULT_PROMPT_FALLBACK:-true}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    ports:
      - "${API_PORT:-6443}:6443"

    volumes:
      # ✅ Bind mount for code (read-only in production)
      - .:/app:rw

      # ✅ Named volumes for data persistence
      - backend-logs:/app/logs
      - backend-uploads:/app/tmp/uploads

    extra_hosts:
      - "kenbo-brg01:${MONGODB_HOST}"

    networks:
      - bridge-api

    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('https://localhost:${API_PORT}/api/health', verify=False)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

networks:
  bridge-api:
    driver: bridge

# ✅ DECLARE NAMED VOLUMES at top level
volumes:
  backend-logs:
    driver: local
  backend-uploads:
    driver: local